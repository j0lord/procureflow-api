services:
  postgres:
    image: postgres:16
    container_name: procureflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: procureflow
      POSTGRES_PASSWORD: procureflow_dev
      POSTGRES_DB: procureflow
    ports:
      - "5432:5432"
    volumes:
      - procureflow_data:/var/lib/postgresql/data

volumes:
  procureflow_data: 